<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f3f3f3;
        transition: 0.3s;
    }

    /* Dark Mode */
    body.dark {
        background: #1c1c1c;
        color: white;
    }

    .container {
        width: 92%;
        max-width: 430px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 0 12px rgba(0,0,0,0.2);
        transition: 0.3s;
        box-sizing: border-box;
    }
    body.dark .container {
        background: #2b2b2b;
        color: white;
    }

    h2 {
        text-align: center;
        margin-top: 0;
    }

    /* Floating labels */
    .input-group {
        position: relative;
        margin-bottom: 22px;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid gray;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
        background: transparent;
    }

    .input-group label {
        position: absolute;
        left: 12px;
        top: 12px;
        font-size: 15px;
        color: gray;
        transition: 0.2s;
        pointer-events: none;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
        top: -8px;
        left: 10px;
        background: inherit;
        font-size: 12px;
        padding: 0 4px;
        color: #2196F3;
    }

    /* Gender Buttons */
    h4 {
        margin-bottom: 10px;
        margin-top: 10px;
    }

    .gender-box {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        gap: 10px;
    }

    .gender-box div {
        flex: 1;
        padding: 10px;
        border: 2px solid gray;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        transition: 0.3s;
        user-select: none;
    }
    .gender-box div:hover {
        border-color: #2196F3;
    }
    .gender-box .selected {
        border-color: #2196F3;
        background: #e9f3ff;
    }

    /* Password Strength */
    #strength {
        margin-top: -14px;
        margin-bottom: 10px;
        font-size: 14px;
    }

    /* Submit Button */
    button {
        width: 100%;
        padding: 12px;
        background: #2196F3;
        border: none;
        color: white;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover {
        background: #0b7dda;
    }

    /* Loader */
    .loader {
        display: none;
        border: 4px solid #ddd;
        border-top: 4px solid #2196F3;
        border-radius: 50%;
        width: 34px;
        height: 34px;
        animation: spin 0.8s linear infinite;
        margin: 10px auto;
    }
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }

    /* Dark/Light toggle */
    .toggle-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        padding: 7px 14px;
        background: black;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }
</style>

</head>
<body>

<div class="toggle-btn" onclick="toggleMode()">Dark/Light</div>

<div class="container">
    <h2>Create New Account</h2>

    <!-- Name -->
    <div class="input-group">
        <input type="text" id="name" required placeholder=" ">
        <label>Full Name</label>
    </div>

    <!-- Email -->
    <div class="input-group">
        <input type="email" id="email" required placeholder=" ">
        <label>Email</label>
    </div>

    <!-- Password -->
    <div class="input-group">
        <input type="password" id="password" required placeholder=" " onkeyup="checkStrength()">
        <label>Password</label>
    </div>

    <div id="strength"></div>

    <!-- Gender -->
    <h4>Select Gender</h4>
    <div class="gender-box">
        <div onclick="selectGender(this,'Male')">♂ Male</div>
        <div onclick="selectGender(this,'Female')">♀ Female</div>
        <div onclick="selectGender(this,'Other')">⚧ Other</div>
    </div>

    <button onclick="submitForm()">Create Account</button>
    <div class="loader" id="loader"></div>
</div>


<script>
    let gender = "";

    function selectGender(box, value) {
        document.querySelectorAll(".gender-box div").forEach(b => b.classList.remove("selected"));
        box.classList.add("selected");
        gender = value;
    }

    // Password Strength Checker
    function checkStrength() {
        let pass = document.getElementById("password").value;
        let strength = document.getElementById("strength");

        if (pass.length < 4) strength.innerHTML = "Weak Password ❌";
        else if (pass.length < 7) strength.innerHTML = "Medium Password ⚠️";
        else strength.innerHTML = "Strong Password ✅";
    }

    // Submit with Loader + Success Page
    function submitForm() {
        document.getElementById("loader").style.display = "block";

        setTimeout(() => {
            window.location.href = "success.html";
        }, 2000);
    }

    // Dark / Light Mode
    function toggleMode() {
        document.body.classList.toggle("dark");
    }
</script>

</body>
</html>
