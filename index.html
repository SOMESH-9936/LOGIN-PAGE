<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Account</title>

    <style>
        body{
            background: linear-gradient(120deg, #000, #111, #222);
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .box{
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(7px);
            width: 80%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        img{
            width: 250px;
            height: auto;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        .love{
            font-size: 1.5rem;
            margin-top: 20px;
            color: pink;
            line-height: 1.8;
        }

        button{
            padding: 10px 20px;
            margin-top: 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            background: white;
            border: none;
        }
    </style>
</head>

<body>

    <h1>💖 Welcome To Your Account 💖</h1>

    <div class="box">
        <img src="https://i.ibb.co/QQfM4bF/love-couple.jpg" alt="Love Image">

        <p class="love">
            "Tumhari muskurahat meri zindagi ki sabse pyari wajah hai…  
            Tum ho toh har din khubsurat lagta hai,  
            aur har raat me sukoon hota hai." 💕
        </p>

        <button onclick="location.href='index.html'">Go to Login</button>
    </div>

</body>
</html>
