<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }
        body{
            background:#f4f4f4;
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            padding:20px;
            transition:0.3s;
        }

        .container{
            width:100%;
            max-width:420px;
            background:#fff;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        /* Floating Labels */
        .input-box{
            position:relative;
            margin-bottom:18px;
        }
        .input-box input{
            width:100%;
            padding:12px;
            font-size:16px;
            outline:none;
            border:1px solid #aaa;
            border-radius:6px;
            background:transparent;
        }
        .input-box label{
            position:absolute;
            left:12px;
            top:12px;
            color:#777;
            transition:0.2s;
            pointer-events:none;
            background:white;
            padding:0 4px;
        }
        .input-box input:focus + label,
        .input-box input:not(:placeholder-shown) + label{
            top:-8px;
            font-size:13px;
            color:#333;
        }

        /* Gender Select */
        .gender-box{
            margin-bottom:15px;
        }
        .gender-box h4{
            margin-bottom:6px;
        }
        .gender{
            display:flex;
            justify-content:space-between;
        }
        .gender div{
            width:30%;
            padding:10px;
            text-align:center;
            border:1px solid #aaa;
            border-radius:6px;
            cursor:pointer;
            transition:0.3s;
        }
        .gender div.active{
            background:#007bff;
            color:white;
        }

        /* Password Strength Bar */
        #strengthBar{
            width:100%;
            height:6px;
            background:#ddd;
            border-radius:5px;
            margin-top:5px;
        }
        #strength{
            height:100%;
            width:0%;
            background:green;
            border-radius:5px;
        }

        /* Submit Button + Loader */
        .btn{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:6px;
            font-size:18px;
            cursor:pointer;
            margin-top:10px;
        }
        .loader{
            display:none;
            margin:auto;
            margin-top:15px;
            border:4px solid #eee;
            border-top:4px solid #007bff;
            width:32px;
            height:32px;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }
        @keyframes spin{
            100%{transform:rotate(360deg);}
        }

        /* Dark Mode */
        body.dark{
            background:#1a1a1a;
            color:white;
        }
        body.dark .container{
            background:#2a2a2a;
            color:white;
        }
        body.dark input{
            background:#222;
            color:white;
            border:1px solid #666;
        }
        #toggle{
            position:absolute;
            top:15px;
            right:15px;
            padding:6px 12px;
            background:black;
            color:white;
            border-radius:20px;
            cursor:pointer;
            font-size:14px;
        }
    </style>
</head>

<body>

<div id="toggle">Dark Mode</div>

<div class="container">
    <h2>Create Your Account</h2>

    <div class="input-box">
        <input type="text" id="name" placeholder=" " required>
        <label>Full Name</label>
    </div>

    <div class="input-box">
        <input type="email" id="email" placeholder=" " required>
        <label>Email Address</label>
    </div>

    <div class="input-box">
        <input type="password" id="password" placeholder=" " required onkeyup="checkStrength()">
        <label>Password</label>

        <div id="strengthBar">
            <div id="strength"></div>
        </div>
    </div>

    <!-- Gender Selector -->
    <div class="gender-box">
        <h4>Select Gender</h4>
        <div class="gender">
            <div onclick="selectGender(this)">Male</div>
            <div onclick="selectGender(this)">Female</div>
            <div onclick="selectGender(this)">Other</div>
        </div>
    </div>

    <!-- Submit -->
    <button class="btn" onclick="submitForm()">Create Account</button>
    <div class="loader" id="load"></div>
</div>

<script>
    // Gender Selection
    function selectGender(el){
        document.querySelectorAll(".gender div").forEach(g=>g.classList.remove("active"));
        el.classList.add("active");
    }

    // Password Strength Checker
    function checkStrength(){
        let pass = document.getElementById("password").value;
        let strength = document.getElementById("strength");

        let score = 0;
        if(pass.length > 5) score++;
        if(/[A-Z]/.test(pass)) score++;
        if(/[0-9]/.test(pass)) score++;
        if(/[^A-Za-z0-9]/.test(pass)) score++;

        let width = ["20%","40%","60%","100%"][score-1] || "10%";
        strength.style.width = width;
        strength.style.background = score < 2 ? "red" : score < 3 ? "orange" : "green";
    }

    // Dark Mode Toggle
    document.getElementById("toggle").onclick = function(){
        document.body.classList.toggle("dark");
        this.innerText = document.body.classList.contains("dark") ? "Light Mode" : "Dark Mode";
    }

    // Form Submit + Loader + Success Page
    function submitForm(){
        document.getElementById("load").style.display = "block";

        setTimeout(()=>{
            document.body.innerHTML = `
                <h1 style="text-align:center;margin-top:40px;">🎉 Welcome to Your Account!</h1>
                <p style="text-align:center;font-size:18px;">Your account has been created successfully.</p>
            `;
        },2000);
    }
</script>

</body>
</html>
