<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        body{
            background-color: rgb(9, 12, 11);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
            padding: 20px 0 60px;
            animation: fade 1s ease;
        }

        @keyframes fade {
            from{ opacity: 0; }
            to{ opacity: 1; }
        }
        .heart{
            position: fixed;
            top: -10vh;
            color: pink;
            font-size: 25px;
            animation: fall 5s linear infinite;
            opacity: 0.8;
        }

        @keyframes fall{
            0%   { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(120vh) rotate(360deg); opacity: 0; }
        }
        .mini-heart{
            position: absolute;
            color: #ff5ea5;
            font-size: 14px;
            animation: floatUp 2s linear infinite;
        }

        @keyframes floatUp{
            0%{ transform: translateY(20px); opacity: 1; }
            100%{ transform: translateY(-20px); opacity: 0; }
        }
        h1 span{
            position: relative;
            font-family: sans-serif;
            color: ghostwhite;
            font-size: 4rem;
            top: 15px;
            animation:bounce 0.5s ease infinite alternate;
        }

        h1 span:nth-child(1){animation-delay: 0s;}
        h1 span:nth-child(2){animation-delay: 0.1s;}
        h1 span:nth-child(3){animation-delay: 0.2s;}
        h1 span:nth-child(4){animation-delay: 0.3s;}
        h1 span:nth-child(5){animation-delay: 0.4s;}
        h1 span:nth-child(6){animation-delay: 0.5s;}
        h1 span:nth-child(7){animation-delay: 0.6s;}

        @keyframes bounce{
            100%{
                top: -100px;
            }
        }
        form{
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            z-index: 10;
            box-sizing: border-box;
            margin-bottom: 40px;

            border: 3px solid transparent;
            background-image: linear-gradient(white, white),
            linear-gradient(45deg, #ff009d, #ff5eda, #b400ff);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            animation: glow 4s linear infinite;
        }

        @keyframes glow{
            0%{ filter: hue-rotate(0deg); }
            100%{ filter: hue-rotate(360deg); }
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid gray;
        }

        button{
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            background: black;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover{
            transform: scale(1.07);
            background: #ff009d;
        }

        a{
            font-weight: bold;
            color: rgb(0, 0, 140);
        }
        .eye-btn{
            position: absolute;
            right: 20px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body><br><br><br>
    <script>
        function createHeart(){
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (20 + Math.random() * 20) + "px";
            heart.style.animationDuration = (4 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 7000);
        }

        setInterval(createHeart, 300);
    </script>

    <h1>
        <span>W</span>
        <span>E</span>
        <span>L</span>
        <span>C</span>
        <span>O</span>
        <span>M</span>
        <span>E</span>
        <span>💕</span>
    </h1>
    <form onsubmit="return validateForm()" action="motivation.html">
        <h1>Create New Account ❤️</h1>
        <span class="mini-heart" style="left:20px; top:20px;">💗</span>
        <span class="mini-heart" style="right:20px; top:50px;">💞</span>

        <label>Upload Photo 📸</label><br>
        <input type="file" accept="image/*"><br><br>

        <label>Full Name 😍</label><br>
        <input type="text" id="fullname" required><br><br>

        <label>Email 💌</label><br>
        <input type="email" id="email" required><br><br>

        <label>Phone Number 📱</label><br>
        <input type="tel" id="phone" required><br><br>

        <label>Username 👤</label><br>
        <input type="text" id="username" required><br><br>

        <label>Password 🔑</label>
        <div style="position:relative;">
            <input type="password" id="password" required>
            <span class="eye-btn" onclick="togglePassword('password')">👁️</span>
        </div><br>

        <label>Confirm Password 🔑</label>
        <div style="position:relative;">
            <input type="password" id="confirm" required>
            <span class="eye-btn" onclick="togglePassword('confirm')">👁️</span>
        </div><br>

        <button type="submit">Create Account 🧾</button>

        <p>
            Already have an account?
            <a href="index.html">Login Here</a>
        </p>

        <button type="button" onclick="location.href='motivation.html'">Login</button>
        <button type="button" onclick="location.href='next.html'">Next</button>
    </form>
    <script>
        function togglePassword(id){
            let x = document.getElementById(id);
            x.type = x.type === "password" ? "text" : "password";
        }

        function validateForm(){
            let p = document.getElementById("password").value;
            let c = document.getElementById("confirm").value;

            if(p !== c){
                alert("❌ Passwords do not match!");
                return false;
            }

            alert("🎉 Account Created Successfully! ❤️");
            return true;
        }
    </script>

</body>
</html>
